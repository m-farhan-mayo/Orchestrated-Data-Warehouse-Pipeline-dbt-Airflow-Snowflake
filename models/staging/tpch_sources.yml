version: 2

sources:
  - name: tpch
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: orders
        coulmns:
          - name: p_orderkey
            tests:
              - unique
              - not_null
      - name: lineitem
        coulmns:
          - name: l_orderkey
            tests:
              - relationship:
                  to: source('tpch', 'orders')
                  field: o_orderkey