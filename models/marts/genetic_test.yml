models:
  - name: fact_orders
    coulmns:
        - name: order_key
          tests:
              - unique
              - not_null
              - relationship:
                    to: ref('stg_tpch_orders')
                    field: order_key
                    severity: warn
        - name: status_code
          tests:
              - accepted_values:
                  values: ['P', 'O', 'F']
              